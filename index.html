<style>
:root{
  color-scheme: dark;
  --bg:#1D1F23; --surface:#24272C; --surface2:#2C2F35; --surface3:#34383F;
  --line:rgba(237,237,238,.09); --line2:rgba(237,237,238,.16);
  --text:#EDEDEE; --muted:#9A9FA8; --zero:#484D57;
  --weekend:#17191C; --today-bg:#FFFFFF; --today-fg:#1D1F23; --today-line:#FFFFFF;
  --accent:#8A3FD9; --accent-soft:rgba(138,63,217,.18);
  --pos:rgba(96,146,230,.30); --pos-fg:#D6E4FF; --zero-s:rgba(242,196,60,.30); --zero-fg:#FFE28F; --neg1:rgba(214,110,112,.28); --neg1-fg:#FFD0D1; --neg2:rgba(200,72,76,.50); --neg2-fg:#FFE1E2; --on-color:#FFFFFF;
  --c-entrada:#2F66E0; --c-saida:#EF4B4F; --c-diario:#EC5DA8; --c-economia:#4DB6F7; --c-cartao:#7A22C8;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --overlay:rgba(8,9,11,.6);
  --logo-a:#FFFFFF; --logo-b:#FFFFFF;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --font:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root.light{
  color-scheme: light;
  --bg:#F3F3F5; --surface:#FFFFFF; --surface2:#F1F1F4; --surface3:#E7E8EC;
  --line:rgba(29,31,35,.09); --line2:rgba(29,31,35,.16);
  --text:#1D1F23; --muted:#686D76; --zero:#B8BCC4;
  --weekend:#E4E5E9; --today-bg:#1D1F23; --today-fg:#FFFFFF; --today-line:#1D1F23;
  --logo-a:#820AD1; --logo-b:#820AD1;
  --pos:#DCE7FA; --pos-fg:#2F5DA8; --zero-s:#FBE3A1; --zero-fg:#5C4700; --neg1:#F8DADB; --neg1-fg:#9B3336; --neg2:#F0B3B5; --neg2-fg:#7E1F22;
  --c-economia:#34A6EE; --c-entrada:#2458C9; --c-cartao:#6A14B8; --accent:#820AD1; --accent-soft:rgba(130,10,209,.10);
  --shadow:0 18px 50px rgba(29,31,35,.18);
  --overlay:rgba(29,31,35,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- layout ---------- */
.app{display:flex;height:100%}
.sidebar{width:228px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-block:18px 12px;transition:width .2s ease;overflow:hidden}
.sidebar.collapsed{width:72px}
.logo{display:flex;align-items:center;gap:10px;padding:0 20px 22px;color:var(--accent);font-weight:700;font-size:18px;white-space:nowrap}
.logo-mark{width:32px;height:32px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;font-size:17px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;letter-spacing:.08em;color:var(--muted);padding:14px 26px 6px;white-space:nowrap}
.collapsed .nav-label{visibility:hidden}
.nav-btn{position:relative;display:flex;align-items:center;gap:14px;height:44px;padding:0 24px;color:var(--muted);font-weight:500;white-space:nowrap;text-align:left;width:100%}
.nav-btn:hover{color:var(--text);background:var(--surface2)}
.nav-btn svg{flex:none;width:22px;height:22px}
.nav-btn.active{color:var(--accent)}
.nav-btn.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.collapsed .nav-btn span.t,.collapsed .logo .t{opacity:0}
.logo{padding-left:19px}
.logo-svg{display:block;flex:none}
.logo-tile{display:inline-flex;flex:none}
.logo .t{letter-spacing:.06em;color:var(--logo-a)}
.drawer-head .dt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dt-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;border-radius:999px;padding:0 12px}
.dt-btn:hover{background:var(--surface2)}
.dt-btn svg{flex:none;color:var(--muted)}
/* tela do dia / do mês */
.drawer.screen{width:min(480px,100%)}
.ph{display:grid!important;grid-template-columns:48px 1fr auto;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:0}
.ph-mid{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.ph-right{display:flex;justify-content:flex-end;gap:4px;min-width:48px}
.ph-title{font-size:26px;font-weight:700;white-space:nowrap}
.ph-date{border-radius:12px;padding:2px 8px}
.ph-date:hover{background:var(--surface2)}
.icon-btn.flat{background:transparent}
.icon-btn.flat:hover{background:var(--surface2)}
.icon-btn.flat svg{width:22px;height:22px}
.pb{padding:0!important;gap:0!important}
.pbar{padding:6px 16px 16px;border-bottom:1px solid var(--line2)}
.pill-dd{display:flex;align-items:center;gap:10px;width:100%;height:48px;padding:0 18px;border:2px solid var(--line2);border-radius:999px;font-weight:600;font-size:16px}
.pill-dd span:not(.ti){flex:1;text-align:left}
.pill-dd svg{color:var(--muted);flex:none}
.lrows{display:flex;flex-direction:column}
.lrow{display:flex;flex-direction:column;gap:6px;padding:18px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.lrow:hover{background:var(--surface2)}
.lrow-top{display:flex;align-items:center;gap:12px;min-width:0}
.lrow-top .ti{width:22px;height:22px;border-radius:99px}
.lrow-top b{flex:1;min-width:0;font-size:17px}
.lrow-val{font-size:17px;white-space:nowrap}
.lrow-sub{color:var(--muted);font-size:14px;padding-left:34px}
.pb .detail-grid{padding:16px}
.pb .skel{margin:12px 16px}
.form-err{margin:0;padding:10px 14px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--c-saida) 14%,transparent);color:var(--c-saida);font-weight:600;font-size:13px}
.toasts{display:none!important}
/* formulário no estilo lista */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.form-modal .modal-body{padding:0 0 12px;gap:0}
.f-money{display:flex;align-items:baseline;gap:8px;padding:8px 20px 18px}
.f-cur{font-size:34px;font-weight:700}
.f-money input{border:0;background:none;outline:none;font-size:44px!important;font-weight:700;width:100%;min-width:0;padding:0}
.f-hint{margin:-12px 20px 12px;color:var(--muted);font-size:13px}
.frows{border-top:1px solid var(--line2)}

/* ---------- saldos board ---------- */
.board{position:absolute;inset:0;overflow:auto;padding:0 24px}

.mtable tfoot td.s-pos{background:linear-gradient(var(--pos),var(--pos)) var(--surface2)} .mtable tfoot td.s-zero{background:linear-gradient(var(--zero-s),var(--zero-s)) var(--surface2)} .mtable tfoot td.s-neg1{background:linear-gradient(var(--neg1),var(--neg1)) var(--surface2)} .mtable tfoot td.s-neg2{background:linear-gradient(var(--neg2),var(--neg2)) var(--surface2)} .m-foot .m-saldo.m-pos{background:linear-gradient(var(--m-pos),var(--m-pos)) var(--surface)} .m-foot .m-saldo.m-zero{background:linear-gradient(var(--m-zero),var(--m-zero)) var(--surface)} .m-foot .m-saldo.m-neg{background:linear-gradient(var(--m-neg),var(--m-neg)) var(--surface)} .s-neg1{background:var(--neg1);color:var(--neg1-fg)} .s-neg2{background:var(--neg2);color:var(--neg2-fg)}

/* ---------- generic surfaces ---------- */
.page{position:absolute;inset:0;overflow:auto;padding:24px}

/* ---------- overlays ---------- */

function initDb(db, userId) {
  S.mode = "db";
  const root = db.doc(`data/users/${userId}/profile`);
  const chk = db.doc(`data/users/${userId}/checkins`);
  const colls = { txs: "tx", tags: "tags", cards: "cards", prev: "prev" };
  const waiting = new Set([...Object.keys(colls), "profile", "checkins"]);
  const done = k => { waiting.delete(k); if (!waiting.size && !S.loaded) { S.loaded = true; } dataChanged(); };
  for (const [k, c] of Object.entries(colls)) {
    root.collection(c).onSnapshot(snap => { S[k] = snap.docs.map(d => ({ id: d.id, ...d.data() })); done(k); }, e => { console.warn(e); done(k); });
  }
  root.onSnapshot(s => { S.profile = s.exists ? { ...s.data() } : null; done("profile"); }, e => { console.warn(e); done("profile"); });
  chk.onSnapshot(s => { S.checkins = s.exists ? { ...(s.data().dates || {}) } : {}; done("checkins"); }, e => { console.warn(e); done("checkins"); });
  backend = {
    put: (c, id, data) => queue(c + id, () => root.collection(c).doc(id).set(data)).catch(onErr),
    del: (c, id) => queue(c + id, () => root.collection(c).doc(id).delete()).catch(onErr),
    putProfile: data => queue("profile", () => root.set(data)).catch(onErr),
    putCheckins: dates => queue("checkins", () => chk.set({ dates })).catch(onErr),
    feedback: data => root.collection("feedback").add(data),
  };
}

  let count = rep === "none" ? 1 : rep === "installment" ? Math.max(1, tx.installments | 0) : (tx.until === "count" ? Math.max(1, tx.count | 0) : Infinity);
  const inst = rep === "installment";
  const per = inst ? r2(Math.floor((tx.value / count) * 100) / 100) : tx.value;
  let i0 = 0;
  if (count === Infinity || count > 400) { // pula direto para perto de "from"
    const f = parse(from);
    if (rep === "daily") i0 = Math.max(0, Math.round((f - start) / 864e5) - 1);
    else if (rep === "weekly") i0 = Math.max(0, Math.floor((f - start) / (864e5 * 7)) - 1);
    else if (rep === "monthly") i0 = Math.max(0, miOf(f) - miOf(start) - 1);
    else if (rep === "yearly") i0 = Math.max(0, f.getFullYear() - start.getFullYear() - 1);
  }
  for (let i = i0; i < count; i++) {
    let d;
    if (rep === "none") d = start;
    else if (rep === "monthly" || inst) d = addMonthsClamp(start, i, od);
    else if (rep === "yearly") d = addMonthsClamp(start, 12 * i, od);
    else if (rep === "weekly") d = addDays(start, 7 * i);
    else d = addDays(start, i);
    const s = ymd(d);
    if (s > to) break;
    if (tx.endBefore && s >= tx.endBefore) break;
    if (s < from || (skip && skip.has(s))) continue;
    const v = inst && i === count - 1 ? r2(tx.value - per * (count - 1)) : per;
    if (cb(s, v, i + 1, count) === false) break;

function occs(from, to) {
  const out = [];
  for (const tx of S.txs) expand(tx, from, to, (date, value, n, total) => out.push({ tx, date, value, n, total }));
  return out;
}

let CALC = null;
function calc() {
  if (CALC) return CALC;
  const tm = tagMap();
  const gEnd = miLast(MAX_MI);
  let gStart = miFirst(MIN_MI);
  for (const tx of S.txs) if (tx.date && tx.date < gStart) gStart = tx.date;
  const day = {};
  for (const tx of S.txs) {
    const ig = ignores(tx, "saldos", tm);
    expand(tx, gStart, gEnd, (d, v) => {
      const o = day[d] || (day[d] = { entrada: 0, saida: 0, diario: 0, economia: 0, cartao: 0, bal: 0 });
      o[tx.type] = r2(o[tx.type] + v);
      if (!ig) o.bal = r2(o.bal + (tx.type === "entrada" ? v : -v));
    });
  }
  const saldo = {};
  const pd = perDayPrev();
  let run = 0;
  for (let d = parse(gStart), end = parse(gEnd); d <= end; d = addDays(d, 1)) {
    const k = ymd(d);
    if (day[k]) run = r2(run + day[k].bal);
    if (pd && k > TODAY) run = r2(run - pd); // previsão de diário: só de amanhã em diante
    saldo[k] = run;
  }
  CALC = { day, saldo, pd };
  return CALC;
}
const saldoOf = d => { const c = calc(); return c.saldo[d] ?? 0; };
const saldoCls = v => Math.abs(v) < 0.005 ? "s-zero" : v > 0 ? "s-pos" : (v > -NEG_SMALL ? "s-neg1" : "s-neg2");

function prevTotal() { return r2(S.prev.reduce((a, p) => a + (+p.value || 0), 0)); }
/* previsão por dia: total do mês dividido sempre por 30 */
function perDayPrev() { return r2(prevTotal() / 30); }
/* valor exibido numa célula: real + previsão (só diário, só dias depois de hoje) */
function cellVal(o, t, ds) { const real = o ? o[t] : 0; const fc = t === "diario" && ds > TODAY ? perDayPrev() : 0; return { v: r2(real + fc), real, fc }; }
function prevDaysIn(mi) { const n = dim(miY(mi), miM(mi)); if (mi < CUR) return 0; if (mi > CUR) return n; return n - NOW.getDate(); }

function monthStats(mi) {
  const tm = tagMap();
  const list = occs(miFirst(mi), miLast(mi));
  const sum = (part) => { const o = { entrada: 0, saida: 0, diario: 0, economia: 0, cartao: 0 }; for (const x of list) if (!part || !ignores(x.tx, part, tm)) o[x.tx.type] = r2(o[x.tx.type] + x.value); return o; };
  const all = sum(null);
  const days = dim(miY(mi), miM(mi));
  const pdv = perDayPrev(), P = r2(pdv * prevDaysIn(mi)); // previsão só dos dias que ainda vão chegar
  const pf = sum("performance"), ec = sum("economizado"), cv = sum("custo"), dm = sum("diarioMedio");
  const passed = mi < CUR ? days : mi > CUR ? 0 : NOW.getDate();
  return {
    list, all, days, P, perDay: pdv, passed,
    performance: r2(pf.entrada - pf.saida - pf.diario - pf.economia - pf.cartao - P),
    econPct: ec.entrada > 0 ? (ec.economia / ec.entrada) * 100 : 0, econVal: ec.economia, econBase: ec.entrada,
    custo: r2(cv.saida + cv.diario + cv.cartao + P), custoBase: cv.entrada,
    diarioMedio: passed ? r2(dm.diario / passed) : null,
  };
}

function toast(msg, err) {
  if (!err) return;

  let box = $(".form-err", m.el);
  if (!box) { box = document.createElement("p"); box.className = "form-err"; box.setAttribute("role", "alert"); $(".modal-body", m.el).prepend(box); }

}

let popClose = null;
function openPopover(anchor, html, { width, onMount, align = "below" } = {}) {
  closePopover();
  const root = $("#pop-root");
  const el = document.createElement("div");
  el.className = "popover";
  el.innerHTML = html;
  if (width) el.style.width = width + "px";
  root.appendChild(el);
  const r = anchor.getBoundingClientRect();
  const vw = innerWidth, vh = innerHeight, m = 12;
  const w = el.offsetWidth, h = el.scrollHeight;
  let left, top;
  if (align === "right") { left = r.right + 8; top = r.top; }
  else { left = r.left; top = r.bottom + 6; }
  if (left + w > vw - m) left = Math.max(m, (align === "right" ? r.left - w - 8 : r.right - w));
  // cabe abaixo? se não, sobe; se ainda não couber, limita a altura com rolagem interna
  if (top + h > vh - m) top = Math.max(m, vh - m - h);
  el.style.left = left + "px"; el.style.top = top + "px";
  el.style.maxHeight = (vh - top - m) + "px";
  const off = e => { if (!el.contains(e.target) && !anchor.contains(e.target)) closePopover(); };
  setTimeout(() => document.addEventListener("pointerdown", off), 0);
  popClose = () => { document.removeEventListener("pointerdown", off); el.remove(); popClose = null; };
  onMount && onMount(el);
  return el;
}
function closePopover() { popClose && popClose(); }

const modals = [];
function openModal({ title, body, foot, wide, onMount, onClose, headExtra, cls }) {
  const ov = document.createElement("div");
  ov.className = "overlay" + (cls === "sheet" ? " ov-sheet" : "");
  ov.innerHTML = `<div class="modal ${wide ? "wide" : ""} ${cls || ""}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><h2>${esc(title)}</h2>${headExtra || ""}<button class="icon-btn" data-close aria-label="fechar janela">${I.x}</button></div>
    <div class="modal-body">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ""}</div>`;
  $("#modal-root").appendChild(ov);
  const api = {
    el: ov.firstElementChild,
    close() { closePopover(); ov.remove(); const i = modals.indexOf(api); if (i >= 0) modals.splice(i, 1); onClose && onClose(); },
    setBody(html) { $(".modal-body", ov).innerHTML = html; },
  };
  modals.push(api);
  ov.addEventListener("pointerdown", e => { if (e.target === ov) api.close(); });
  $("[data-close]", ov).onclick = () => api.close();
  onMount && onMount(api.el, api);
  const f = $("input,textarea,select", api.el); if (f && !f.readOnly) setTimeout(() => f.focus(), 30);
  return api;
}
function openSheet(opts) { return openModal({ ...opts, cls: "sheet" }); }
function confirmBox({ title, text, ok = "confirmar", danger = true }) {
  return new Promise(res => {
    let done = false;
    const m = openModal({
      title, body: `<p style="margin:0;color:var(--muted);line-height:1.55">${text}</p>`,
      foot: `<button class="btn block" data-no>cancelar</button><button class="btn block ${danger ? "solid-danger" : "primary"}" data-ok>${esc(ok)}</button>`,
      onClose: () => { if (!done) res(false); },
    });
    $("[data-no]", m.el).onclick = () => m.close();
    $("[data-ok]", m.el).onclick = () => { done = true; m.close(); res(true); };
  });
}
document.addEventListener("keydown", e => {

  if (PANEL.open) closePanel();
});

    await delTx(tx.id); afterDelete(); toast("movimentação apagada"); return;
  }
  const nd = nextOccDate(tx, date);
  const s = await chooseScope({ title: "apagar", text: `"${esc(tx.desc)}" se repete. o que você quer apagar?`, date, hasNext: !!nd, danger: true });
  if (!s) return;
  const first = occInfo(tx, date)?.n === 1;
  if (s === "all" || (s === "from" && first)) await delTx(tx.id);
  else if (s === "one") await saveTx(tx.id, { ...stripId(tx), skip: [...(tx.skip || []), date] });
  else if (s === "from") await saveTx(tx.id, { ...stripId(tx), endBefore: date });

}

      const start = shiftDate(tx.date, delta);
      const keep = tx.rep === f.rep && start === tx.date;
      await saveTx(tx.id, { ...base, value: stored(f.value, f.rep, f.installments), date: start, createdAt: tx.createdAt || now, skip: keep ? tx.skip || [] : [], endBefore: keep ? tx.endBefore || null : null });
    } else {
      const cut = s === "from" ? occD : nd;
      const done = s === "from" ? n - 1 : n;
      const cnt = f.rep === tx.rep && f.until === "count" && f.count === (tx.count || 12) ? Math.max(1, f.count - done) : f.count;
      const ins = f.rep === "installment" && tx.rep === "installment" && f.installments === (tx.installments || 2) ? Math.max(1, f.installments - done) : f.installments;
      await saveTx(tx.id, { ...old, endBefore: cut });
      await saveTx(uid("t"), { ...base, count: cnt, installments: ins, value: stored(f.value, f.rep, ins), date: shiftDate(cut, delta), createdAt: now, skip: (tx.skip || []).filter(x => x > cut) });
    }
    toast(s === "one" ? "mudou só esse" : s === "next" ? "próximos atualizados" : "edição salva");
    if (PANEL.open) { PANEL.detail = null; renderPanel(); }
  }
}

function datePicker(anchor, value, onPick) {
  closePopover();
  let sel = value, cur = parse(value), vy = cur.getFullYear(), vm = cur.getMonth();
  const WDF = ["dom.", "seg.", "ter.", "qua.", "qui.", "sex.", "sáb."];
  const html = () => {
    const first = new Date(vy, vm, 1).getDay(), n = dim(vy, vm), mi = vy * 12 + vm;
    let g = WDF.map(w => `<span class="wd">${w}</span>`).join("");
    const cell = (y, m0, d, out) => { const s = `${y}-${pad(m0 + 1)}-${pad(d)}`; return `<button data-day="${s}" class="num ${out ? "out" : ""} ${s === sel ? "sel" : ""} ${s === TODAY ? "tdy" : ""}" aria-label="${dLong(s)}" ${s === sel ? 'aria-pressed="true"' : ""}>${d}</button>`; };
    const pmi = mi - 1, pn = dim(miY(pmi), miM(pmi));
    for (let i = first - 1; i >= 0; i--) g += cell(miY(pmi), miM(pmi), pn - i, true);
    for (let d = 1; d <= n; d++) g += cell(vy, vm, d, false);
    const tail = (7 - ((first + n) % 7)) % 7, nmi = mi + 1;
    for (let d = 1; d <= tail; d++) g += cell(miY(nmi), miM(nmi), d, true);
    return `<div class="cal2"><div class="cal2-head"><b>${MONTHS[vm]} de ${vy}</b>
      <button class="icon-btn flat" data-today aria-label="ir para hoje">${I.cal}</button>
      <button class="icon-btn flat" data-cm="-1" aria-label="mês anterior" ${mi <= MIN_MI ? "disabled" : ""}>${I.left}</button>
      <button class="icon-btn flat" data-cm="1" aria-label="próximo mês" ${mi >= MAX_MI ? "disabled" : ""}>${I.right}</button></div>
      <div class="cal2-grid">${g}</div></div><button class="btn block primary" data-dsave>salvar</button>`;
  };
  const s = openSheet({ title: "data", body: html() });
  const body = $(".modal-body", s.el);
  s.el.addEventListener("click", e => {
    const cm = e.target.closest("[data-cm]");
    if (cm) { const mi = vy * 12 + vm + +cm.dataset.cm; vy = miY(mi); vm = miM(mi); body.innerHTML = html(); return; }
    if (e.target.closest("[data-today]")) { sel = TODAY; vy = NOW.getFullYear(); vm = NOW.getMonth(); body.innerHTML = html(); return; }
    const d = e.target.closest("[data-day]");
    if (d) { sel = d.dataset.day; const p = parse(sel); vy = p.getFullYear(); vm = p.getMonth(); body.innerHTML = html(); return; }
    if (e.target.closest("[data-dsave]")) { s.close(); onPick(sel); }
  });
}

async function signOut() {
  if (!(await confirmBox({ title: "sair da conta?", text: "você pode entrar de novo quando quiser.", ok: "sair", danger: false }))) return;
  closePanel();
  if (backend.signOut) { await backend.signOut(); return; }
  UI.signedOut = "out"; render();

/* ================= login (supabase) ================= */
let AUTH = "login";
function hideAuth() { const el = $("#auth"); if (el) el.remove(); $("#app").style.display = ""; const f = $("#fab"); if (f) placeFab(); }
function showAuth(mode) {
  AUTH = mode; closePanel(); while (modals.length) modals[modals.length - 1].close();
  $("#app").style.display = "none"; const fab = $("#fab"); if (fab) fab.hidden = true;
  let el = $("#auth");
  if (!el) { el = document.createElement("div"); el.id = "auth"; el.className = "auth"; document.body.appendChild(el); bindAuth(el); }
  const pw = (id, label, ac) => `<div class="field"><label for="${id}">${label}</label><div class="input-wrap"><input class="input" id="${id}" type="password" autocomplete="${ac}"><button class="eye" type="button" data-eye="${id}" aria-label="mostrar senha">${I.eye}</button></div></div>`;
  const T = {
    loading: ["carregando…", "", ""],
    login: ["entra aí", "entre com seu e-mail e senha.", `<div class="field"><label for="au-e">e-mail</label><input class="input" id="au-e" type="email" autocomplete="email" inputmode="email"></div>${pw("au-p", "senha", "current-password")}
      <button class="btn primary block" data-au="login">entrar</button>
      <div class="auth-links"><button data-go="forgot">esqueci minha senha</button><button data-go="signup">criar conta</button></div>`],
    signup: ["criar conta", "leva menos de um minuto.", `<div class="field"><label for="au-n">nome</label><input class="input" id="au-n" autocomplete="given-name"></div>
      <div class="field"><label for="au-e">e-mail</label><input class="input" id="au-e" type="email" autocomplete="email" inputmode="email"></div>${pw("au-p", "senha", "new-password")}${pw("au-p2", "repetir senha", "new-password")}
      <button class="btn primary block" data-au="signup">criar conta</button>
      <div class="auth-links"><button data-go="login">já tenho conta</button></div>`],
    forgot: ["esqueci minha senha", "a gente manda um link pro seu e-mail pra você criar uma senha nova.", `<div class="field"><label for="au-e">e-mail</label><input class="input" id="au-e" type="email" autocomplete="email" inputmode="email"></div>
      <button class="btn primary block" data-au="forgot">mandar link</button>
      <div class="auth-links"><button data-go="login">voltar pro login</button></div>`],
    newpass: ["nova senha", "escolha a senha nova da sua conta.", `${pw("au-p", "nova senha", "new-password")}${pw("au-p2", "repetir senha", "new-password")}
      <button class="btn primary block" data-au="newpass">salvar senha</button>`],
  }[mode];
  el.innerHTML = `<form class="auth-card" novalidate>${logoSVG(64, true)}<h2>${T[0]}</h2>${T[1] ? `<p class="muted">${T[1]}</p>` : ""}${T[2]}<p class="auth-msg" id="au-msg" role="alert"></p></form>`;
}
function bindAuth(el) {
  el.addEventListener("submit", e => { e.preventDefault(); const b = $("[data-au]", el); if (b) b.click(); });
  el.addEventListener("click", async e => {
    const eye = e.target.closest("[data-eye]");
    if (eye) { e.preventDefault(); const i = $("#" + eye.dataset.eye, el); const show = i.type === "password"; i.type = show ? "text" : "password"; eye.innerHTML = show ? I.eyeOff : I.eye; eye.setAttribute("aria-label", show ? "esconder senha" : "mostrar senha"); return; }
    const go = e.target.closest("[data-go]"); if (go) { e.preventDefault(); showAuth(go.dataset.go); return; }
    const b = e.target.closest("[data-au]"); if (!b) return;
    e.preventDefault();
    const msg = t => { $("#au-msg", el).textContent = t; };
    const email = ($("#au-e", el)?.value || "").trim(), pass = $("#au-p", el)?.value || "", pass2 = $("#au-p2", el)?.value || "";
    const mode = b.dataset.au;
    if (mode !== "newpass" && !/^\S+@\S+\.\S+$/.test(email)) return msg("confere o e-mail");
    if ((mode === "login" || mode === "signup" || mode === "newpass") && pass.length < 6) return msg("a senha precisa ter pelo menos 6 caracteres");
    if ((mode === "signup" || mode === "newpass") && pass !== pass2) return msg("as senhas não são iguais");
    b.disabled = true; msg("");
    try {
      if (mode === "login") { const { error } = await SB.auth.signInWithPassword({ email, password: pass }); if (error) throw error; }
      if (mode === "signup") {
        const { data, error } = await SB.auth.signUp({ email, password: pass, options: { data: { nome: ($("#au-n", el).value || "").trim() } } });
        if (error) throw error;
        if (!data.session) { showAuthKeepMsg("login", "pronto! confirma a conta pelo link que mandamos no seu e-mail e depois entra aqui."); }
      }
      if (mode === "forgot") { const { error } = await SB.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0] }); if (error) throw error; msg("se esse e-mail tiver conta, o link já está a caminho."); }
      if (mode === "newpass") { const { error } = await SB.auth.updateUser({ password: pass }); if (error) throw error; msg("senha salva! entrando…"); setTimeout(() => location.replace(location.href.split("#")[0]), 800); }
    } catch (err) {
      console.warn(err);
      const m = String(err.message || "");
      msg(/invalid login/i.test(m) ? "e-mail ou senha errados" : /already registered/i.test(m) ? "esse e-mail já tem conta. é só entrar" : /rate|seconds/i.test(m) ? "muitas tentativas. espera um pouquinho e tenta de novo" : "não deu certo. tenta de novo");
    } finally { const bb = $("[data-au]", el); if (bb) bb.disabled = false; }
  });
}
function showAuthKeepMsg(mode, text) { showAuth(mode); const m = $("#au-msg"); if (m) m.textContent = text; }
function renderSignedOut() {
  $("#app").style.display = "none";
  let el = $("#signed");
  if (!el) { el = document.createElement("div"); el.id = "signed"; el.className = "full-screen"; el.style.background = "var(--bg)"; document.body.appendChild(el); }
  const del = UI.signedOut === "deleted";
  el.innerHTML = `${logoSVG(64, true)}
    <h2 style="margin:0;font-size:24px">${del ? "sua conta foi apagada" : "você saiu da sua conta"}</h2>
    <p class="muted" style="margin:0;max-width:34ch">${del ? "tudo foi excluído. se quiser, dá pra começar do zero agora." : "até logo! seus dados continuam salvos."}</p>
    <button class="btn primary" id="relog">${del ? "começar do zero" : "entrar de novo"}</button>`;
  $("#relog").onclick = () => {
    if (del) backend.putProfile({ ...DEFAULT_PROFILE });
    UI.signedOut = false; el.remove(); $("#app").style.display = ""; UI.tab = "saldos"; $("#view").dataset.tab = ""; render();
  };
}

/* ================= celular: zoom bloqueado em tudo ================= */
if ("ontouchstart" in window || navigator.maxTouchPoints > 0) {
  const stop = e => e.preventDefault();
  ["gesturestart", "gesturechange", "gestureend"].forEach(ev => document.addEventListener(ev, stop, { passive: false }));
  document.addEventListener("touchstart", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener("touchmove", e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
  let lastTap = 0;
  document.addEventListener("touchend", e => { const t = Date.now(); if (t - lastTap < 350 && !e.target.closest("button,a,input,textarea,select,label,[role=button]")) e.preventDefault(); lastTap = t; }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
}

initStore().then(() => {
  if (S.profile && S.profile.deleted) UI.signedOut = "deleted";
